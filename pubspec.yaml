
name: quick_scanner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^10.1.4
  pdf: ^3.11.3
  file_picker: ^10.0.0
  image_cropper: ^8.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf